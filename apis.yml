aid: tipp24
name: Tipp24
description: 'Tipp24 is a German consumer online-lottery brand — a business-to-consumer service where
  players place bets on the outcomes of state and international lottery draws (secondary lottery / lottery
  brokerage) over the web and mobile apps. The brand is operated by ZEAL Network SE, a publicly listed
  company headquartered in Hamburg, Germany, whose email infrastructure (SPF/DMARC) still resolves to
  zealnetwork.de. Tipp24 is a regulated consumer gambling product; it exposes no public developer API,
  developer portal, or SDKs, and its web properties (tipp24.de, tipp24.com) sit behind Cloudflare bot
  protection. This profile originated as an Earlybird VC portfolio lead and was processed by the API
  Evangelist enrichment pipeline, which confirmed the absence of an API surface and captured the domain
  security posture of the brand.'
